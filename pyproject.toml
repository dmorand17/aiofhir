[project]
name = "aiofhir"
version = "0.1.1"
description = "Async FHIR R4 and SMART on FHIR client"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Doug Morand" }]
dependencies = ["httpx>=0.27"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/dmorand17/aiofhir"
Documentation = "https://github.com/dmorand17/aiofhir/tree/main/docs"
Changelog = "https://github.com/dmorand17/aiofhir/blob/main/CHANGELOG.md"
Issues = "https://github.com/dmorand17/aiofhir/issues"

[project.optional-dependencies]
# private_key_jwt client authentication (RS384/ES384).
jwt = [
    "pyjwt[crypto]>=2.10",
]

# Development tools. A dependency group is never published as an extra; uv
# installs it by default. `uv sync --all-extras` adds jwt for the tests.
[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "python-dotenv>=1.0",
    "respx>=0.22",
    "ruff>=0.8",
]
# The Streamlit demo in examples/ (`just demo`). Not installed by default.
demo = [
    "streamlit>=1.40",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aiofhir"]

# The sdist is the library and its docs; plans, reviews and Haste tooling stay in the repo.
[tool.hatch.build.targets.sdist]
include = ["/src/aiofhir", "/docs", "/README.md", "/CHANGELOG.md", "/LICENSE", "/pyproject.toml"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "."]
extend-exclude = ["plans"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "G"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "examples", "haste"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["respx", "respx.*"]
ignore_missing_imports = true

# The demo group (examples/streamlit_app.py) is not installed by `just check` or CI.
[[tool.mypy.overrides]]
module = ["streamlit", "streamlit.*"]
ignore_missing_imports = true
