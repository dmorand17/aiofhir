[project]
name = "aiofhir"
version = "0.0.0"
description = "Async FHIR R4 and SMART on FHIR client"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Doug Morand" }]
dependencies = ["httpx>=0.27"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.optional-dependencies]
# Reference backend for RemoteRecord. Never imported by `import aiofhir`.
server = [
    "cryptography>=43",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]
dev = [
    "aiofhir[server]",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "python-dotenv>=1.0",
    "respx>=0.22",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aiofhir"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "."]
extend-exclude = ["plans"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "G"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "examples", "haste"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["respx", "respx.*"]
ignore_missing_imports = true
